services:
  - type: web
    name: hospital-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-management-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hospital-management-db
    plan: free
    databaseName: hospital
    user: hospital
